# Weekly version updates, grouped into one PR per ecosystem: uv.lock and the SHA-pinned actions.
# Cooldown: a release waits 7 days before a version update proposes it, time
# for a compromised release to be caught and yanked. Security updates skip it.
# The merge-dependabot job in .github/workflows/ci.yml squash-merges each PR once the install check passes.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    # Indirect dependencies too: by default version updates move only the
    # direct ones, so a package pulled in by another sits until a security alert.
    allow:
      - dependency-type: "all"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - "*"
